<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Funkin' Coding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b12;
  --panel:#13131e;
  --panel2:#0f0f18;
  --border:#25253a;
  --text:#e8e8f2;
  --dim:#8888a6;
  --dimmer:#54546c;
  --haxe:#f7931e;
  --lua:#5b7cff;
  --accent:var(--haxe);
  --accent-dim:#f7931e33;
  --ok:#4ade80;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;}
body{
  min-height:100vh;
  background-image:
    linear-gradient(var(--border) 1px, transparent 1px),
    linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size:34px 34px;
  background-position:center;
  background-attachment:fixed;
  position:relative;
  transition:background-color .4s ease;
}
body::before{
  content:'';
  position:fixed;
  inset:0;
  background:radial-gradient(ellipse at 50% -10%, var(--accent-dim), transparent 60%);
  pointer-events:none;
  transition:background .5s ease;
  z-index:0;
}
body.lang-lua{ --accent:var(--lua); --accent-dim:#5b7cff2e; }
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:36px 24px 80px;}

.site-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:24px;
  flex-wrap:wrap;
  border-bottom:1px solid var(--border);
  padding-bottom:24px;
  margin-bottom:28px;
}
.header-left{display:flex;align-items:center;gap:16px;}
.logo{
  width:52px;height:52px;
  border:1.5px solid var(--accent);
  display:flex;align-items:center;justify-content:center;
  font-family:'JetBrains Mono',monospace;
  font-weight:700;
  color:var(--accent);
  font-size:18px;
  border-radius:6px;
  transition:color .4s ease, border-color .4s ease;
  flex-shrink:0;
}
h1{
  font-size:22px;
  letter-spacing:1px;
  font-weight:700;
}
.tagline{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  color:var(--dim);
  margin-top:4px;
  letter-spacing:.5px;
}
.lang-switch{
  display:flex;
  align-items:center;
  gap:12px;
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  font-weight:600;
  letter-spacing:1px;
}
.lang-switch button{
  background:none;border:none;color:var(--dimmer);
  cursor:pointer;font-family:inherit;font-size:inherit;font-weight:inherit;letter-spacing:inherit;
  padding:6px 2px;
  transition:color .3s ease;
}
.lang-switch button.active{color:var(--text);}
.switch-track{
  width:52px;height:26px;
  border:1.5px solid var(--border);
  border-radius:14px;
  position:relative;
  cursor:pointer;
  background:var(--panel2);
}
.switch-thumb{
  position:absolute;
  top:2px;left:2px;
  width:19px;height:19px;
  border-radius:50%;
  background:var(--accent);
  transition:left .25s cubic-bezier(.65,0,.35,1), background .3s ease;
  box-shadow:0 0 10px var(--accent-dim);
}
body.lang-lua .switch-thumb{left:27px;}

.tabs{
  display:flex;
  gap:6px;
  margin-bottom:28px;
  border-bottom:1px solid var(--border);
}
.tab-btn{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  letter-spacing:1.5px;
  background:none;
  border:none;
  color:var(--dim);
  padding:12px 18px;
  cursor:pointer;
  border-bottom:2px solid transparent;
  transition:all .2s ease;
}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}
.tab-panel{display:none;}
.tab-panel.active{display:block;}

.workspace{
  display:grid;
  grid-template-columns:320px 1fr;
  gap:20px;
  margin-bottom:56px;
}
@media(max-width:820px){.workspace{grid-template-columns:1fr;}}

.panel{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:10px;
  overflow:hidden;
}
.form-panel{padding:22px;}
.field-label{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  letter-spacing:1px;
  color:var(--dim);
  text-transform:uppercase;
  display:block;
  margin-bottom:8px;
  margin-top:20px;
}
.field-label:first-of-type{margin-top:0;}
select, input[type=text], input[type=number]{
  width:100%;
  background:var(--panel2);
  border:1px solid var(--border);
  color:var(--text);
  font-family:'JetBrains Mono',monospace;
  font-size:13px;
  padding:10px 12px;
  border-radius:6px;
  outline:none;
  transition:border-color .2s ease;
}
select:focus, input:focus{border-color:var(--accent);}
#generateBtn{
  width:100%;
  margin-top:26px;
  background:var(--accent);
  border:none;
  color:#0b0b12;
  font-family:'JetBrains Mono',monospace;
  font-weight:700;
  letter-spacing:1.5px;
  font-size:13px;
  padding:13px;
  border-radius:6px;
  cursor:pointer;
  transition:background .3s ease, transform .1s ease;
}
#generateBtn:active{transform:scale(.98);}

.output-panel{display:flex;flex-direction:column;min-height:380px;}
.terminal-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 18px;
  border-bottom:1px solid var(--border);
  background:var(--panel2);
  flex-wrap:wrap;
  gap:10px;
}
.cmd-line{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  color:var(--dim);
}
.cmd-line b{color:var(--accent);font-weight:600;}
.term-actions{display:flex;gap:8px;}
.term-actions button{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  letter-spacing:.5px;
  background:transparent;
  border:1px solid var(--border);
  color:var(--dim);
  padding:7px 12px;
  border-radius:5px;
  cursor:pointer;
  transition:all .2s ease;
}
.term-actions button:hover{border-color:var(--accent);color:var(--accent);}
.code-output{
  flex:1;
  padding:20px;
  font-family:'JetBrains Mono',monospace;
  font-size:13px;
  line-height:1.7;
  color:var(--text);
  overflow-x:auto;
  white-space:pre;
}

.library h2, .tutorials h2{
  font-family:'JetBrains Mono',monospace;
  font-size:13px;
  letter-spacing:2px;
  color:var(--dim);
  margin-bottom:20px;
}
.cartridge-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:14px;
}
.cartridge{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:8px;
  padding:18px;
  cursor:pointer;
  transition:border-color .2s ease, transform .15s ease;
  position:relative;
}
.cartridge:hover{border-color:var(--card-accent, var(--accent));transform:translateY(-2px);}
.cart-tag{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  letter-spacing:1px;
  color:var(--card-accent, var(--accent));
  border:1px solid currentColor;
  display:inline-block;
  padding:3px 8px;
  border-radius:4px;
  margin-bottom:12px;
}
.cart-title{font-size:15px;font-weight:600;margin-bottom:6px;}
.cart-desc{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--dim);line-height:1.5;}

.tutorials{margin-bottom:56px;}
.tut-list{display:flex;flex-direction:column;gap:10px;}
.tut-item{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:8px;
  overflow:hidden;
}
.tut-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:16px 20px;
  cursor:pointer;
}
.tut-head-title{display:flex;align-items:center;gap:14px;}
.tut-num{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--accent);
  border:1px solid var(--border);
  width:26px;height:26px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.tut-title{font-size:15px;font-weight:600;}
.tut-chevron{
  font-family:'JetBrains Mono',monospace;
  color:var(--dim);
  transition:transform .25s ease;
  flex-shrink:0;
}
.tut-item.open .tut-chevron{transform:rotate(45deg);}
.tut-body{
  max-height:0;
  overflow:hidden;
  transition:max-height .3s ease;
  padding:0 20px;
}
.tut-item.open .tut-body{padding:0 20px 20px;}
.tut-body p{
  font-size:13.5px;
  line-height:1.7;
  color:var(--dim);
  margin-bottom:10px;
}
.tut-body p:last-child{margin-bottom:0;}
.tut-body code{
  font-family:'JetBrains Mono',monospace;
  background:var(--panel2);
  border:1px solid var(--border);
  padding:1px 6px;
  border-radius:4px;
  color:var(--text);
  font-size:12.5px;
}
.tut-body pre{
  font-family:'JetBrains Mono',monospace;
  background:var(--panel2);
  border:1px solid var(--border);
  border-radius:6px;
  padding:12px 14px;
  font-size:12.5px;
  overflow-x:auto;
  color:var(--text);
  margin:10px 0;
  white-space:pre;
}

footer{
  margin-top:20px;
  text-align:center;
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--dimmer);
  letter-spacing:.5px;
}
</style>
</head>
<body class="lang-haxe">
<div class="wrap">

<header class="site-header">
  <div class="header-left">
    <div class="logo">FC</div>
    <div>
      <h1>FUNKIN' CODING</h1>
      <div class="tagline">HScript / Lua snippet generator + tutorials for FNF engines</div>
    </div>
  </div>
  <div class="lang-switch" id="langSwitch">
    <button data-lang="haxe" class="active" id="btnHaxe">HAXE</button>
    <div class="switch-track" id="switchTrack"><div class="switch-thumb"></div></div>
    <button data-lang="lua" id="btnLua">LUA</button>
  </div>
</header>

<div class="tabs">
  <button class="tab-btn active" data-tab="generator">GENERATOR</button>
  <button class="tab-btn" data-tab="library">CARTRIDGES</button>
  <button class="tab-btn" data-tab="tutorials">TUTORIALS</button>
</div>

<div class="tab-panel active" id="tab-generator">
  <section class="workspace">
    <div class="panel form-panel">
      <span class="field-label">Snippet Category</span>
      <select id="categorySelect"></select>
      <div id="fieldsContainer"></div>
      <button id="generateBtn">GENERATE SNIPPET</button>
    </div>

    <div class="panel output-panel">
      <div class="terminal-header">
        <span class="cmd-line">$ fc --lang=<b id="langLabel">haxe</b> --emit=<b id="categoryLabel">beatHit</b></span>
        <div class="term-actions">
          <button id="copyBtn">COPY</button>
          <button id="downloadBtn">DOWNLOAD</button>
        </div>
      </div>
      <pre class="code-output"><code id="codeOutput"></code></pre>
    </div>
  </section>
</div>

<div class="tab-panel" id="tab-library">
  <section class="library">
    <h2>READY-MADE CARTRIDGES</h2>
    <div class="cartridge-grid" id="cartridgeGrid"></div>
  </section>
</div>

<div class="tab-panel" id="tab-tutorials">
  <section class="tutorials">
    <h2>TUTORIALS</h2>
    <div class="tut-list" id="tutList"></div>
  </section>
</div>

<footer>FUNKIN' CODING — snippets are boilerplate, verify against your engine's API before shipping</footer>
</div>

<script>
const schema = {
  beatHit: {
    title: 'Beat Hit Reaction',
    fields: [
      {key:'characterName', label:'Character variable', type:'text', default:'bf'},
      {key:'beatEvery', label:'Trigger every N beats', type:'number', default:4}
    ]
  },
  noteHit: {
    title: 'Custom Note Type',
    fields: [
      {key:'noteType', label:'Note type string', type:'text', default:'Custom Note'},
      {key:'pointsBonus', label:'Bonus score', type:'number', default:50}
    ]
  },
  cameraZoom: {
    title: 'Camera Zoom Event',
    fields: [
      {key:'zoomAmount', label:'Target zoom value', type:'text', default:'1.05'},
      {key:'zoomDuration', label:'Trigger every N beats', type:'number', default:8}
    ]
  },
  healthChange: {
    title: 'Health Modifier',
    fields: [
      {key:'trigger', label:'Trigger on', type:'select', options:['On Note Hit','On Note Miss','On Beat'], default:'On Note Miss'},
      {key:'amount', label:'Health delta', type:'text', default:'-0.05'}
    ]
  },
  customEvent: {
    title: 'Custom Song Event',
    fields: [
      {key:'eventName', label:'Event name (from chart)', type:'text', default:'FlashScreen'}
    ]
  },
  boilerplate: {
    title: 'Script Boilerplate',
    fields: [
      {key:'scriptName', label:'Script file name', type:'text', default:'MyScript'}
    ]
  },
  ratingChange: {
    title: 'Judgement Text Override',
    fields: [
      {key:'ratingName', label:'Display text', type:'text', default:'Perfect!'},
      {key:'ratingImage', label:'Splash animation name', type:'text', default:'sick'}
    ]
  },
  keybind: {
    title: 'Custom Keybind Check',
    fields: [
      {key:'keyName', label:'Key (e.g. R, F1, ESCAPE)', type:'text', default:'R'}
    ]
  },
  discordPresence: {
    title: 'Discord Rich Presence',
    fields: [
      {key:'details', label:'Details line', type:'text', default:'Playing a song'},
      {key:'state', label:'State line', type:'text', default:'Freeplay'}
    ]
  },
  characterReposition: {
    title: 'Character Reposition',
    fields: [
      {key:'characterName', label:'Character variable', type:'text', default:'gf'},
      {key:'xOffset', label:'X offset', type:'text', default:'0'},
      {key:'yOffset', label:'Y offset', type:'text', default:'-20'}
    ]
  },
  comboPopup: {
    title: 'Combo Milestone Popup',
    fields: [
      {key:'comboThreshold', label:'Combo count', type:'number', default:50},
      {key:'message', label:'Popup text', type:'text', default:'ON FIRE!'}
    ]
  },
  shakeOnSick: {
    title: 'Screen Shake On Sick Note',
    fields: [
      {key:'shakeIntensity', label:'Shake intensity', type:'text', default:'0.02'},
      {key:'shakeDuration', label:'Shake duration (seconds)', type:'text', default:'0.1'}
    ]
  }
};

function generate(lang, category, v){
  const isHaxe = lang === 'haxe';
  if(category === 'beatHit'){
    return isHaxe
      ? `function onBeatHit()\n{\n    if (curBeat % ${v.beatEvery} == 0)\n    {\n        ${v.characterName}.playAnim('idle', true);\n    }\n}`
      : `function onBeatHit()\n    if curBeat % ${v.beatEvery} == 0 then\n        setProperty('${v.characterName}.animation.curAnim.name', 'idle')\n    end\nend`;
  }
  if(category === 'noteHit'){
    return isHaxe
      ? `function goodNoteHit(note:Note)\n{\n    if (note.noteType == '${v.noteType}')\n    {\n        addScore(${v.pointsBonus});\n    }\n}`
      : `function goodNoteHit(id, noteType, isSustainNote)\n    if noteType == '${v.noteType}' then\n        addScore(${v.pointsBonus})\n    end\nend`;
  }
  if(category === 'cameraZoom'){
    return isHaxe
      ? `function onBeatHit()\n{\n    if (curBeat % ${v.zoomDuration} == 0)\n    {\n        camGame.zoom = ${v.zoomAmount};\n        camHUD.zoom += 0.03;\n    }\n}`
      : `function onBeatHit()\n    if curBeat % ${v.zoomDuration} == 0 then\n        camZooming = true\n        forcedZoom = true\n        setProperty('camGame.zoom', ${v.zoomAmount})\n    end\nend`;
  }
  if(category === 'healthChange'){
    const map = {
      'On Note Hit': {hx:'goodNoteHit(note:Note)', lua:'goodNoteHit(id, noteType, isSustainNote)'},
      'On Note Miss': {hx:'noteMiss(note:Note)', lua:'noteMiss(id, direction, noteType, isSustainNote)'},
      'On Beat': {hx:'onBeatHit()', lua:'onBeatHit()'}
    };
    const sig = map[v.trigger] || map['On Note Miss'];
    return isHaxe
      ? `function ${sig.hx}\n{\n    health += ${v.amount};\n}`
      : `function ${sig.lua}\n    health = health + ${v.amount}\nend`;
  }
  if(category === 'customEvent'){
    return isHaxe
      ? `function onEvent(eventName:String, value1:String, value2:String)\n{\n    if (eventName == '${v.eventName}')\n    {\n        camHUD.alpha = 0;\n        camHUD.alpha = 1;\n    }\n}`
      : `function onEvent(eventName, value1, value2)\n    if eventName == '${v.eventName}' then\n        setProperty('camHUD.alpha', 0)\n        setProperty('camHUD.alpha', 1)\n    end\nend`;
  }
  if(category === 'boilerplate'){
    return isHaxe
      ? `function onCreate()\n{\n}\n\nfunction onCreatePost()\n{\n}\n\nfunction onUpdate(elapsed:Float)\n{\n}\n\nfunction onDestroy()\n{\n}`
      : `function onCreate()\nend\n\nfunction onCreatePost()\nend\n\nfunction onUpdate(elapsed)\nend\n\nfunction onDestroy()\nend`;
  }
  if(category === 'ratingChange'){
    return isHaxe
      ? `function onUpdateScore(miss:Bool)\n{\n    if (!miss)\n    {\n        comboText.text = '${v.ratingName}';\n        setPropertyFromGroup('grpNoteSplashes', -1, 'animation', '${v.ratingImage}');\n    }\n}`
      : `function onUpdateScore(miss)\n    if not miss then\n        setProperty('comboText.text', '${v.ratingName}')\n        setPropertyFromGroup('grpNoteSplashes', -1, 'animation', '${v.ratingImage}')\n    end\nend`;
  }
  if(category === 'keybind'){
    const luaKey = String(v.keyName || '').toLowerCase();
    return isHaxe
      ? `function onUpdate(elapsed:Float)\n{\n    if (FlxG.keys.justPressed.${v.keyName.toUpperCase()})\n    {\n        resetSong();\n    }\n}`
      : `function onUpdate(elapsed)\n    if keyboardJustPressed('${luaKey}') then\n        resetSong()\n    end\nend`;
  }
  if(category === 'discordPresence'){
    return isHaxe
      ? `function onCreate()\n{\n    DiscordClient.changePresence('${v.details}', '${v.state}');\n}`
      : `function onCreate()\n    changePresence('${v.details}', '${v.state}', nil, true)\nend`;
  }
  if(category === 'characterReposition'){
    return isHaxe
      ? `function onCreatePost()\n{\n    ${v.characterName}.x += ${v.xOffset};\n    ${v.characterName}.y += ${v.yOffset};\n}`
      : `function onCreatePost()\n    setProperty('${v.characterName}.x', getProperty('${v.characterName}.x') + ${v.xOffset})\n    setProperty('${v.characterName}.y', getProperty('${v.characterName}.y') + ${v.yOffset})\nend`;
  }
  if(category === 'comboPopup'){
    return isHaxe
      ? `function onUpdateScore(miss:Bool)\n{\n    if (combo == ${v.comboThreshold})\n    {\n        var popup:FlxText = new FlxText(0, 100, FlxG.width, '${v.message}');\n        popup.setFormat(null, 32, FlxColor.WHITE, CENTER);\n        popup.cameras = [camHUD];\n        popup.screenCenter(X);\n        addLuaSprite('comboPopup', popup);\n        FlxTween.tween(popup, {alpha: 0}, 1, {startDelay: 0.5, onComplete: function(_) removeLuaSprite('comboPopup', true)});\n    }\n}`
      : `function onUpdateScore(miss)\n    if combo == ${v.comboThreshold} then\n        makeLuaText('comboPopup', '${v.message}', 0, FlxG.width, 100)\n        setTextSize('comboPopup', 32)\n        addLuaText('comboPopup')\n        screenCenter('comboPopup', 'x')\n        setObjectCamera('comboPopup', 'camHUD')\n        tweenAlpha('comboPopupTween', 'comboPopup', 0, 1, 'linear')\n    end\nend`;
  }
  if(category === 'shakeOnSick'){
    return isHaxe
      ? `function onUpdateScore(miss:Bool)\n{\n    if (!miss && ratingName == 'sick')\n    {\n        camGame.shake(${v.shakeIntensity}, ${v.shakeDuration});\n    }\n}`
      : `function onUpdateScore(miss)\n    if not miss and ratingName == 'sick' then\n        camShake('camGame', ${v.shakeIntensity}, ${v.shakeDuration})\n    end\nend`;
  }
  return '';
}

const cartridges = [
  {lang:'haxe', title:'Flash Screen on Event', tag:'HAXE', desc:'White flash triggered by a chart event, fades out over one beat.',
   code:`function onEvent(eventName:String, value1:String, value2:String)\n{\n    if (eventName == 'FlashScreen')\n    {\n        var flash:FlxSprite = new FlxSprite(0, 0).makeGraphic(FlxG.width, FlxG.height, FlxColor.WHITE);\n        flash.scrollFactor.set();\n        flash.cameras = [camHUD];\n        addLuaSprite('flash', flash);\n        FlxTween.tween(flash, {alpha: 0}, 0.6, {onComplete: function(_) removeLuaSprite('flash', true)});\n    }\n}`},
  {lang:'lua', title:'Custom Health Bar Color', tag:'LUA', desc:'Recolors the health bar based on which side is winning.',
   code:`function onUpdate(elapsed)\n    if health > 1 then\n        setProperty('healthBar.leftBarColor', '#66ff66')\n    else\n        setProperty('healthBar.leftBarColor', '#ff6666')\n    end\nend`},
  {lang:'haxe', title:'Character Swap Mid-Song', tag:'HAXE', desc:'Swaps the opponent character on a specific step, keeping position.',
   code:`function onStepHit()\n{\n    if (curStep == 128)\n    {\n        var oldX = dad.x;\n        var oldY = dad.y;\n        dad = new Character(oldX, oldY, 'new-character', false);\n        insert(members.indexOf(gf) + 1, dad);\n    }\n}`},
  {lang:'lua', title:'Discord Rich Presence Update', tag:'LUA', desc:'Pushes a custom status line to Discord once the song starts.',
   code:`function onStartCountdown()\n    changePresence('Vibing to ' .. getSongName(), 'On ' .. difficultyName .. ' difficulty', nil, true)\nend`},
  {lang:'haxe', title:'Combo Break Camera Shake', tag:'HAXE', desc:'Shakes the game camera briefly whenever the combo resets.',
   code:`function onNoteMiss(note:Note)\n{\n    if (combo <= 0)\n    {\n        camGame.shake(0.01, 0.15);\n    }\n}`},
  {lang:'lua', title:'Note Splash Color Override', tag:'LUA', desc:'Forces note splashes to match a fixed hex color per lane.',
   code:`function onNoteHit(id, direction, noteType, isSustainNote)\n    if noteType == '' then\n        setPropertyFromGroup('grpNoteSplashes', -1, 'color', '#ff4fd8')\n    end\nend`},
  {lang:'haxe', title:'Custom Pause Menu Option', tag:'HAXE', desc:'Adds an extra selectable option to the pause menu list.',
   code:`function onPause()\n{\n    if (pauseMusic != null)\n    {\n        pauseOptions.push('Restart With Modifiers');\n    }\n}\n\nfunction onPauseOptionSelected(option:String)\n{\n    if (option == 'Restart With Modifiers')\n    {\n        MusicBeatState.switchState(new modifiers.ModifierMenu());\n    }\n}`},
  {lang:'lua', title:'Freeplay Song Sort Override', tag:'LUA', desc:'Reorders the freeplay song list alphabetically on load.',
   code:`function onCreate()\n    table.sort(freeplaySongs)\nend`}
];

const tutorials = [
  {title:'HScript vs Lua: what actually changes', body:`
    <p>Both languages hook into the same engine lifecycle, so the function names you override (<code>onCreate</code>, <code>onBeatHit</code>, <code>onNoteHit</code>...) are shared. What changes is syntax and how you touch objects.</p>
    <p>HScript reads like normal Haxe: curly braces, semicolons, typed declarations, and direct property access like <code>character.x</code>. Lua uses <code>then / end</code> blocks, no semicolons, and leans on helper calls like <code>setProperty</code> and <code>getProperty</code> because Lua scripts can't reach Haxe objects directly.</p>
    <p>Pick HScript when you want closer engine access and don't mind Haxe-like syntax. Pick Lua when you want a script that runs unmodified across more Psych Engine forks, since the Lua API surface is more standardized.</p>
  `},
  {title:'The script lifecycle, in order', body:`
    <p>Every script runs through the same sequence each song. Knowing the order tells you where to put setup code versus per-frame logic.</p>
    <pre>onCreate()        -> before the stage loads
onCreatePost()    -> right after the stage finishes loading
onStartCountdown()-> when the 3-2-1 begins
onUpdate(elapsed) -> every single frame
onStepHit()       -> every chart step
onBeatHit()       -> every 4 steps
onNoteHit() / onNoteMiss() -> per note
onEndSong()       -> after the last note
onDestroy()       -> when the state closes</pre>
    <p>Position changes and object creation belong in <code>onCreatePost</code>, not <code>onCreate</code> — the stage isn't fully built yet at that point.</p>
  `},
  {title:'Reading custom events from the chart', body:`
    <p>Events are the placed markers you add in the chart editor. Every event fires <code>onEvent(eventName, value1, value2)</code>, where <code>value1</code> and <code>value2</code> are whatever strings you typed into the event's two fields in the editor.</p>
    <p>Match on <code>eventName</code> first, then branch on the values if the same event needs different behavior depending on what was typed. This keeps one script handling many event variants instead of writing a new function per event.</p>
  `},
  {title:'Where custom notes plug in', body:`
    <p>A custom note type is just a string tag you set on a note inside the chart editor. In your script, that tag arrives as <code>note.noteType</code> (HScript) or the <code>noteType</code> argument (Lua) inside the hit and miss callbacks.</p>
    <p>Common uses: bonus-score notes, notes that trigger an animation instead of damage, or notes that get skipped entirely by returning early before the default scoring runs.</p>
  `},
  {title:'Debugging without breaking the build', body:`
    <p>Since scripts run inside the compiled engine, the fastest debugging loop is usually: change one function at a time, reload the song, and confirm the specific behavior you touched. Isolating one function per test avoids chasing an unrelated bug.</p>
    <p>For values you need to inspect over time, write them to a small on-screen text object rather than the console — it keeps the feedback visible during actual gameplay, which matters for anything frame- or beat-timed.</p>
  `}
];

const categorySelect = document.getElementById('categorySelect');
const fieldsContainer = document.getElementById('fieldsContainer');
const codeOutput = document.getElementById('codeOutput');
const langLabel = document.getElementById('langLabel');
const categoryLabel = document.getElementById('categoryLabel');
let currentLang = 'haxe';

Object.keys(schema).forEach(key => {
  const opt = document.createElement('option');
  opt.value = key;
  opt.textContent = schema[key].title;
  categorySelect.appendChild(opt);
});

function renderFields(category){
  fieldsContainer.innerHTML = '';
  schema[category].fields.forEach(f => {
    const label = document.createElement('span');
    label.className = 'field-label';
    label.textContent = f.label;
    fieldsContainer.appendChild(label);

    let input;
    if(f.type === 'select'){
      input = document.createElement('select');
      f.options.forEach(o => {
        const op = document.createElement('option');
        op.value = o;
        op.textContent = o;
        input.appendChild(op);
      });
      input.value = f.default;
    } else {
      input = document.createElement('input');
      input.type = f.type;
      input.value = f.default;
    }
    input.dataset.key = f.key;
    input.id = 'field-' + f.key;
    fieldsContainer.appendChild(input);
  });
}

function collectValues(category){
  const v = {};
  schema[category].fields.forEach(f => {
    const el = document.getElementById('field-' + f.key);
    v[f.key] = el.value;
  });
  return v;
}

function extension(lang){ return lang === 'haxe' ? 'hx' : 'lua'; }

function typeOut(text){
  codeOutput.textContent = '';
  let i = 0;
  const speed = Math.max(2, Math.floor(300 / text.length));
  const interval = setInterval(() => {
    codeOutput.textContent = text.slice(0, i) + '▌';
    i++;
    if(i > text.length){
      clearInterval(interval);
      codeOutput.textContent = text;
    }
  }, speed);
}

function runGenerate(){
  const category = categorySelect.value;
  const values = collectValues(category);
  const code = generate(currentLang, category, values);
  categoryLabel.textContent = category;
  typeOut(code);
}

function setLang(lang){
  currentLang = lang;
  document.body.className = 'lang-' + lang;
  document.getElementById('btnHaxe').classList.toggle('active', lang === 'haxe');
  document.getElementById('btnLua').classList.toggle('active', lang === 'lua');
  langLabel.textContent = lang;
  runGenerate();
}

categorySelect.addEventListener('change', () => {
  renderFields(categorySelect.value);
  runGenerate();
});
document.getElementById('generateBtn').addEventListener('click', runGenerate);
document.getElementById('btnHaxe').addEventListener('click', () => setLang('haxe'));
document.getElementById('btnLua').addEventListener('click', () => setLang('lua'));
document.getElementById('switchTrack').addEventListener('click', () => setLang(currentLang === 'haxe' ? 'lua' : 'haxe'));

document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(codeOutput.textContent);
  const btn = document.getElementById('copyBtn');
  const old = btn.textContent;
  btn.textContent = 'COPIED';
  setTimeout(() => btn.textContent = old, 1200);
});

document.getElementById('downloadBtn').addEventListener('click', () => {
  const category = categorySelect.value;
  const name = category === 'boilerplate' ? collectValues('boilerplate').scriptName : category;
  const blob = new Blob([codeOutput.textContent], {type:'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${name}.${extension(currentLang)}`;
  a.click();
});

const cartridgeGrid = document.getElementById('cartridgeGrid');
cartridges.forEach(c => {
  const card = document.createElement('div');
  card.className = 'cartridge';
  card.style.setProperty('--card-accent', c.lang === 'haxe' ? 'var(--haxe)' : 'var(--lua)');
  card.innerHTML = `
    <span class="cart-tag">${c.tag}</span>
    <div class="cart-title">${c.title}</div>
    <div class="cart-desc">${c.desc}</div>
  `;
  card.addEventListener('click', () => {
    setLang(c.lang);
    document.querySelector('.tab-btn[data-tab="generator"]').click();
    categoryLabel.textContent = c.title.toLowerCase().replace(/\s+/g, '-');
    typeOut(c.code);
  });
  cartridgeGrid.appendChild(card);
});

const tutList = document.getElementById('tutList');
tutorials.forEach((t, idx) => {
  const item = document.createElement('div');
  item.className = 'tut-item';
  item.innerHTML = `
    <div class="tut-head">
      <div class="tut-head-title">
        <span class="tut-num">${idx + 1}</span>
        <span class="tut-title">${t.title}</span>
      </div>
      <span class="tut-chevron">+</span>
    </div>
    <div class="tut-body">${t.body}</div>
  `;
  const head = item.querySelector('.tut-head');
  const body = item.querySelector('.tut-body');
  head.addEventListener('click', () => {
    const isOpen = item.classList.contains('open');
    item.classList.toggle('open', !isOpen);
    body.style.maxHeight = isOpen ? '0' : body.scrollHeight + 'px';
  });
  tutList.appendChild(item);
});

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

renderFields('beatHit');
runGenerate();
</script>
</body>
</html>
