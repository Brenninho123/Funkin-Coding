name: Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: windows-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Syntax-check server and client scripts
        run: |
          node --check server.js
          node --check project.js
          node --check source/Main.js
          node --check login.js
          node --check community.js
          node --check sw.js

      - name: Validate manifest.json and package.json
        shell: pwsh
        run: |
          Get-Content manifest.json | ConvertFrom-Json | Out-Null
          Get-Content package.json | ConvertFrom-Json | Out-Null

      - name: Boot the server and check /health
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "node" -ArgumentList "server.js" -PassThru -NoNewWindow
          Start-Sleep -Seconds 3
          try {
            $response = Invoke-WebRequest -Uri "http://localhost:3000/health" -UseBasicParsing -TimeoutSec 10
            if ($response.StatusCode -ne 200) {
              throw "Expected HTTP 200 from /health, got $($response.StatusCode)"
            }
            Write-Host "Server responded OK: $($response.Content)"
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Confirm static files are served
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "node" -ArgumentList "server.js" -PassThru -NoNewWindow
          Start-Sleep -Seconds 3
          try {
            $paths = @("/", "/index.html", "/project.js", "/source/Main.js", "/manifest.json")
            foreach ($path in $paths) {
              $response = Invoke-WebRequest -Uri "http://localhost:3000$path" -UseBasicParsing -TimeoutSec 10
              if ($response.StatusCode -ne 200) {
                throw "Expected HTTP 200 for $path, got $($response.StatusCode)"
              }
              Write-Host "$path -> $($response.StatusCode)"
            }
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Build Windows executable
        run: npx pkg server.js --targets node20-win-x64 --output dist/funkin-coding.exe

      - name: Smoke-test the executable
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist/funkin-coding.exe" -PassThru -NoNewWindow
          Start-Sleep -Seconds 3
          try {
            $response = Invoke-WebRequest -Uri "http://localhost:3000/health" -UseBasicParsing -TimeoutSec 10
            if ($response.StatusCode -ne 200) {
              throw "Expected HTTP 200 from packaged exe /health, got $($response.StatusCode)"
            }
            $indexResponse = Invoke-WebRequest -Uri "http://localhost:3000/index.html" -UseBasicParsing -TimeoutSec 10
            if ($indexResponse.StatusCode -ne 200) {
              throw "Expected HTTP 200 for /index.html from packaged exe, got $($indexResponse.StatusCode)"
            }
            Write-Host "Packaged exe responded OK."
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Upload Windows executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: funkin-coding-windows-exe
          path: dist/funkin-coding.exe
          if-no-files-found: error
